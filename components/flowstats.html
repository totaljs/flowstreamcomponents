<script total>

	exports.id = 'flowstats';
	exports.name = 'Flow stats';
	exports.icon = 'ti ti-chart-line';
	exports.author = 'Peter Širka | Total.js';
	exports.version = '1';
	exports.group = 'Flow';
	exports.config = { path: 'stats' };
	exports.inputs = [{ id: 'input', name: 'Input' }];
	exports.outputs = [{ id: 'output', name: 'Output' }];

	exports.make = function(instance, config) {

		instance.message = function($) {

			let data = $.data;
			let stats = instance.main.stats;
			let payload = {};
			let activities = [];

			for (let key in instance.main.activities) {
				let tmp = instance.main.activities[key];
				for (let key2 in tmp) {
					let activity = tmp[key2];
					if (activity.value)
						activities.push({ value: activity.value });
				}
			}

			payload.memory = stats.memory;
			payload.online = stats.online;
			payload.paused = stats.paused;
			payload.errors = stats.errors;
			payload.messages = stats.messages;
			payload.pending = stats.pending;
			payload.mm = stats.mm;
			payload.minutes = stats.minutes;
			payload.activities = activities.length ? Math.ceil(activities.reduce((sum, item) => sum + item.value, 0) / activities.length) : 0;

			if (config.path) {
				if (config.path.includes('.'))
					U.set(data, config.path, payload);
				else
					data[config.path] = payload;
			} else
				data = payload;

			$.send('output', data);
		};

	};

</script>
