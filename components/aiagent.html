<script total>

	exports.id = 'aiagent';
	exports.name = 'AI Agent';
	exports.icon = 'ti ti-brain';
	exports.author = 'Peter Širka | Total.js';
	exports.version = '1';
	exports.group = 'AI';
	exports.config = { model: 'gpt-4o-mini', thinking: true, url: 'https://api.openai.com/v1/chat/completions', token: '', parser: 'openai', tools: [], timeout: 60 };
	exports.inputs = [{ id: 'input', name: 'Input' }];
	exports.outputs = [{ id: 'output', name: 'Output' }, { id: 'error', name: 'Error' }];

	exports.call = function(data, next){
		let response = [];
		for (let key in Total.actions) {
			let action = Total.actions[key];
			if (action.name && action.istool)
				response.push({ id: key, name: action.name });
		}
		next(response);
	};

	exports.make = function(instance, config) {

		let opt = {};
		let TOOLS = {};
		let thinking = [];

		instance.message = function($) {

			// opt.messages {Object Array}
			// opt.model {String}
			// opt.tools {String Array}
			// opt.think {Boolean}
			// opt.format {String}
			// opt.options {Object}
			// opt.url {String}


			let status = {};

			status.id = GUID(4);
			status.thinking = '';

			instance.activity(status.id, status.id + ': ' + $.data.messages[0].content.max(50));

			thinking.push(status);

			let callback = function(err, messages) {
				thinking.splice(thinking.indexOf(status), 1);
				instance.status(thinking, 200);
				instance.activity(status.id, null);
				if (err) {
					$.data.messages.push({ role: 'developer', content: err });
					$.send('error');
				} else {
					$.data.messages = messages;
					$.send('output');
				}
			};

			if (typeof(opt.tools) === 'string')
				opt.tools = opt.tools.split(',').trim();

			let limits = {};
			let payload = {};

			payload.messages = $.data.messages;

			if (opt.tools) {
				payload.tools = [];
				for (let tool of opt.tools.trim()) {

					if (!TOOLS[tool]) {
						let action = Total.actions[tool];
						if (!action) {
							callback('Tool "{0}" not found.'.format(tool));
							return;
						}
						let schema = action.jsinput ? action.jsinput.toAITool(tool) : { type: 'function', function: { name: tool, parameters: { type: 'object', properties: {}, required: [] }}};
						schema.function.description = action.summary;
						TOOLS[tool] = schema;
					}

					let at = Total.actions[tool];
					limits[tool] = at?.config?.limit || 1000;

					if (at?.config?.end)
						opt.end = tool;

					payload.tools.push(TOOLS[tool]);
				}
			}

			let parser = AIPARSER('openai');
			let req = {};

			opt.thinking && parser.on('thinking', function(obj) {
				status.thinking = obj.thinking;
				instance.status(thinking, 200);
			});

			payload.model = opt.model;
			payload.stream = true;

			req.method = 'POST';
			req.url = opt.url;
			req.timeout = config.timeout * 1000;
			req.custom = true;
			req.type = 'json';
			req.body = JSON.stringify(payload);

			if (opt.token)
				req.headers = { authorization: 'Bearer ' + opt.token };

			req.callback = function(err, response) {

				let lines = [];

				if (response.status !== 200) {

					if (response.stream) {
						let buffer = [];
						response.stream.on('data', chunk => buffer.push(chunk));
						response.stream.on('end', function() {
							let data = Buffer.concat(buffer).toString('utf8').parseJSON();
							callback(data?.error?.message || data, opt);
						});
					} else {
						callback(response.status + '', opt);
					}
					return;
				}

				response.stream.on('data', chunk => parser.write(chunk));
				response.stream.on('end', function() {

					let output = parser.end();
					status.thinking = '';
					instance.status(thinking, 200);

					if (output.reasoning === 'tool') {

						payload.messages.push({
							role: 'assistant',
							content: null,
							tool_calls: output.tools.map(tool => ({
								id: tool.id,
								type: 'function',
								function: {
									name: tool.name,
									arguments: JSON.stringify(tool.arguments)
								}
							}))
						});

						output.tools.wait(function(tool, next) {

							if (limits[tool.name] == null) {
								payload.messages.push({
									role: 'tool',
									tool_call_id: tool.id,
									content: JSON.stringify(tool_error(tool, 'TOOL_CALL_LIMIT_EXCEEDED', 'The maximum number of executions has been exceeded.'))
								});
								next();
								return;
							}

							if (limits[tool.name] <= 0) {
								payload.messages.push({
									role: 'tool',
									tool_call_id: tool.id,
									content: JSON.stringify(tool_error(tool, 'TOOL_NOT_FOUND', 'The requested tool does not exist.'))
								});
								next();
								return;
							}

							limits[tool.name] -= 1;

							let fn = opt.tools.findItem(n => n.function?.name === tool.name);
							ACTION(tool.name, tool.arguments).user(opt.user).callback(function(err, response) {
								if (tool.name === opt.end)
									output.END = response;
								let res = JSON.stringify(err ? tool_error(tool, 'TOOL_ERROR', err.toString()) : response);
								payload.messages.push({ role: 'tool', tool_call_id: tool.id, content: res });
								next();
							});

						}, function() {
							if (output.END) {
								payload.messages.push({ role: 'assistant', content: output.content });
								callback(null, output.END);
							} else {
								status.thinking = '';
								instance.status(thinking, 200);
								parser.reset();
								req.body = JSON.stringify(payload);
								REQUEST(req);
							}
						});
					} else {
						payload.messages.push({ role: 'assistant', content: output.content });
						callback(null, payload.messages);
					}
				});
			};

			REQUEST(req);
		};

		instance.configure = function() {
			opt = instance.replace(config);
		};

		instance.configure();

	};

</script>
