<script total>

	exports.id = 'aitool';
	exports.name = 'AI Tool';
	exports.icon = 'ti ti-brain';
	exports.author = 'Peter Širka | Total.js';
	exports.version = '1';
	exports.group = 'AI';
	exports.config = { code: "$.callback({ message: input.message });", name: 'print', summary: 'This tool prints a input value', input: '*message:String', output: 'message:String', color: '#4285F4' };
	exports.inputs = [{ id: 'input', name: 'Test' }];
	exports.outputs = [{ id: 'output', name: 'Test' }];

	exports.make = function(instance, config) {

		let action;

		instance.message = function($) {
			ACTION(config.name, $.data).callback(function(err, response) {
				$.send('output', err || response);
			});
		};

		instance.configure = function() {
			let fn = new Function('$', 'let input = model = data = $.model;\n' + config.code);
			action && action.remove();
			action = NEWACTION(config.name, {
				name: config.name,
				istool: true,
				summary: config.summary,
				mpc: true,
				input: config.input,
				output: config.output,
				action: fn
			});
		};

		instance.close = function() {
			action && action.remove();
		};

		instance.configure();

	};

</script>
